<html><head><style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;background:#0b0a10;overflow:hidden;font-family:Inter;color:#fff}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.grid{position:absolute;inset:-200px;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:60px 60px}
.glow{position:absolute;width:1400px;height:1400px;border-radius:50%;left:-160px;top:100px;background:radial-gradient(#5b3fd655,transparent 62%)}
canvas{position:absolute;left:0;top:0}
.L{position:absolute;left:0;right:0;text-align:center;font-family:Anton;text-transform:uppercase;line-height:1;letter-spacing:1px;opacity:0;will-change:transform}
.v{color:#8b6dff}.r{color:#ff4d5e}
.card{position:absolute;width:420px;height:300px;border-radius:26px;background:#14121c;border:2px solid #2c2838;opacity:0;padding:26px 30px}
.card .p{font-family:'JetBrains Mono';font-weight:700;font-size:44px}.card .s{font-family:'JetBrains Mono';font-size:28px;color:#8d8a98;margin-top:6px}
.card canvas{position:absolute;left:20px;top:120px}
.sub{position:absolute;left:70px;right:70px;top:1500px;text-align:center;font-size:46px;font-weight:800;line-height:1.25;opacity:0;text-shadow:0 4px 18px #000}
.sub span{background:#5b3fd6;padding:2px 10px;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tag{position:absolute;left:80px;top:120px;font-family:'JetBrains Mono';font-size:34px;color:#8b6dff;letter-spacing:2px}
.foot{position:absolute;left:80px;right:80px;bottom:110px;display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:30px;color:#7d7a88}
.flash{position:absolute;inset:0;background:#ff4d5e;opacity:0;mix-blend-mode:screen}
.hm{position:absolute;left:190px;top:560px;display:grid;grid-template-columns:repeat(6,110px);gap:10px}
.hm div{width:110px;height:110px;border-radius:14px;opacity:0;transform:scale(.5)}
.strike{position:absolute;height:16px;background:#ff4d5e;left:200px;top:0;width:0;border-radius:8px}
.half{position:absolute;top:520px;width:470px;height:760px;border-radius:30px;border:2px solid #2c2838;background:#100e17;opacity:0}
.half h3{font-family:Anton;font-weight:400;font-size:62px;text-align:center;margin-top:36px;text-transform:uppercase}
.half canvas{position:absolute;left:15px;top:170px}
.btn{position:absolute;left:50%;top:1000px;transform:translateX(-50%);background:#5b3fd6;font-family:Anton;font-size:110px;padding:20px 70px;border-radius:30px;opacity:0;text-transform:uppercase}
</style></head><body>
<div id=cam><div class=grid></div><div class=glow></div><canvas id=bg width=1080 height=1920></canvas>
<div class=tag>// ERRORI CHE HO FATTO IO</div>
<div class=L id=a1 style="top:450px;font-size:165px">Avevo <span class=v>6 bot.</span></div>
<div class=L id=a2 style="top:740px;font-size:110px">Pensavo di essere</div>
<div class=L id=a3 style="top:870px;font-size:150px" ><span class=v>diversificato.</span></div>
<div id=cards></div>
<div class=L id=c1 style="top:330px;font-size:150px">Lo yen<br>si muove…</div>
<div class=L id=c2 style="top:330px;font-size:150px"><span class=r>Perdono<br>tutti.</span></div>
<div class=L id=d1 style="top:560px;font-size:330px">6 bot</div><div class=strike id=st></div>
<div class=L id=d2 style="top:960px;font-size:190px"><span class=v>1 scommessa</span></div>
<div class=half id=h1 style="left:60px"><h3><span class=r>Tanti bot</span></h3><canvas id=hc1 width=440 height=560></canvas></div>
<div class=half id=h2 style="left:550px"><h3><span class=v>Bot diversi</span></h3><canvas id=hc2 width=440 height=560></canvas></div>
<div class=L id=e1 style="top:330px;font-size:120px">Controlla la<br><span class=v>correlazione</span></div>
<div class=hm id=hm></div>
<div class=L id=g1 style="top:520px;font-size:120px">Ogni giorno<br>un errore<br><span class=v>che ho fatto io</span></div>
<div class=btn id=g2>Seguimi</div>
<div class=flash id=fl></div>
</div>
<div class=sub id=sub></div>
<div class=foot><span><b style="font-family:Anton;font-size:40px;color:#fff;letter-spacing:2px">MS</b>&nbsp;&nbsp;@cthe.trader</span><span>#2</span></div>
<script>
const LINES=[[0.3,3.85,"Avevo 6 bot. Pensavo di essere diversificato."],[4.2,12.17,"USDJPY · EURJPY · CADJPY · AUDJPY · NZDJPY · CHFJPY"],[12.5,16.05,"Poi lo yen si è mosso. E hanno perso tutti insieme."],[16.4,18.75,"6 bot. Una sola scommessa."],[19.1,24.35,"Diversificare = bot che non si muovono insieme."],[24.7,29.22,"Prima di aggiungerne uno, controlla la correlazione."],[29.6,33.8,"Seguimi: ogni giorno un errore che ho fatto io."]];
const PAIRS=["USDJPY","EURJPY","CADJPY","AUDJPY","NZDJPY","CHFJPY"];
const cl=(x,a,b)=>Math.max(0,Math.min(1,(x-a)/(b-a))), eo=x=>1-Math.pow(1-x,3), eb=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let s=11;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
// sparkline data: common rise then common drop
const base=[];let v=0;for(let i=0;i<120;i++){v+= i<80?0.8+(rnd()-0.4)*1.2:-2.6+(rnd()-0.5)*1.5;base.push(v)}
const series=PAIRS.map(()=>base.map(x=>x+(rnd()-0.5)*6));
const cards=document.getElementById('cards');
PAIRS.forEach((p,i)=>{const d=document.createElement('div');d.className='card';d.id='k'+i;d.style.left=(70+(i%2)*520)+'px';d.style.top=(330+Math.floor(i/2)*340)+'px';d.innerHTML=`<div class=p>${p}</div><div class=s>bot #${i+1}</div><canvas width=380 height=150></canvas>`;cards.appendChild(d)});
const hm=document.getElementById('hm');
const corr=[];for(let i=0;i<36;i++){const r=Math.floor(i/6),c=i%6;corr.push(r===c?1:0.75+rnd()*0.22)}
corr.forEach(()=>{hm.appendChild(document.createElement('div'))});
function spark(cv,data,k,col){const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);const mn=Math.min(...data),mx=Math.max(...data);x.lineWidth=6;x.strokeStyle=col;x.shadowColor=col;x.shadowBlur=14;x.beginPath();for(let i=0;i<=k;i++){const X=10+i*(cv.width-20)/(data.length-1),Y=cv.height-10-(data[i]-mn)/(mx-mn)*(cv.height-20);i?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke()}
function op(id,a,b,f=0.2){return Math.min(cl(T,a,a+f),1-cl(T,b-f,b))}
function pop(id,a,b,from=0.6){const e=document.getElementById(id);const o=op(id,a,b);const k=eb(cl(T,a,a+0.35));e.style.opacity=o;e.style.transform=`scale(${from+(1-from)*k}) translateY(${(1-eo(cl(T,a,a+0.3)))*60}px)`;e.style.filter=`blur(${(1-cl(T,a,a+0.25))*14}px)`}
let T=0;const bg=document.getElementById('bg').getContext('2d');
window.render=t=>{T=t;
 // camera: slow push + punch on beats + shake at crash
 let sc=1+0.03*Math.sin(t*0.4)+0.06*Math.max(0,1-Math.abs(t-0.4)*4)+0.08*Math.max(0,1-Math.abs(t-14.4)*3)+0.05*Math.max(0,1-Math.abs(t-16.5)*4);
 let sh= t>14.3&&t<15.2 ? (1-cl(t,14.3,15.2))*22 : 0;
 document.getElementById('cam').style.transform=`scale(${sc}) translate(${Math.sin(t*90)*sh}px,${Math.cos(t*77)*sh}px)`;
 // bg drifting lines in intro
 bg.clearRect(0,0,1080,1920);const bo=op('bg',0,4.2,0.4)*0.35;
 if(bo>0){bg.globalAlpha=bo;series.forEach((d,j)=>{bg.strokeStyle='#8b6dff';bg.lineWidth=4;bg.beginPath();for(let i=0;i<80;i++){const X=-40+i*15+((t*40)%15),Y=1250+j*40-(d[i]-d[0])*6;i?bg.lineTo(X,Y):bg.moveTo(X,Y)}bg.stroke()});bg.globalAlpha=1}
 pop('a1',0.3,4.15,0.4);pop('a2',1.7,4.15);pop('a3',2.4,4.15,0.3);
 // cards
 PAIRS.forEach((p,i)=>{const e=document.getElementById('k'+i);const a=4.4+i*1.25;const o=Math.min(cl(t,a,a+0.25),1-cl(t,16.2,16.4));e.style.opacity=o;const k=eb(cl(t,a,a+0.4));
  const y=t>12.5? -380*eo(cl(t,12.5,13.0))*0 : 0; e.style.transform=`scale(${0.7+0.3*k})`;
  const cv=e.querySelector('canvas');const drop=t>14.3;const kk=drop?Math.floor(80+39*eo(cl(t,14.3,15.3))):Math.floor(79*eo(cl(t,a,a+1.2)));
  spark(cv,series[i],Math.max(1,kk),drop?'#ff4d5e':'#8b6dff');e.style.borderColor=drop?'#ff4d5e':'#2c2838'});
 pop('c1',12.5,14.35,0.5);{const ee=eo(cl(t,12.4,12.9));const cc=document.getElementById('cards');cc.style.transformOrigin='540px 780px';cc.style.transform=`translateY(${ee*270}px) scale(${1-0.2*ee})`;cc.style.position='absolute';cc.style.inset='0';}pop('c2',14.3,16.2,0.3);
 document.getElementById('fl').style.opacity= t>14.3&&t<14.7?0.45*(1-cl(t,14.3,14.7)):0;
 pop('d1',16.4,19.0,1.4);const st=document.getElementById('st');st.style.top='760px';st.style.width=(680*eo(cl(t,17.0,17.35)))+'px';st.style.opacity=op('st',17.0,19.0);
 pop('d2',17.5,19.0,0.3);
 ['h1','h2'].forEach((h,j)=>{const e=document.getElementById(h);const a=19.1+j*1.6;e.style.opacity=op(h,a,24.6);e.style.transform=`translateY(${(1-eo(cl(t,a,a+0.4)))*120}px)`});
 const c1=document.getElementById('hc1').getContext('2d'),c2=document.getElementById('hc2').getContext('2d');c1.clearRect(0,0,440,560);c2.clearRect(0,0,440,560);
 const kk=Math.floor(119*cl(t,19.4,23.5));
 for(let j=0;j<5;j++){[[c1,series[j],'#ff4d5e'],[c2,null,'#8b6dff']].forEach(([c,d,col],w)=>{c.strokeStyle=col;c.globalAlpha=0.8;c.lineWidth=5;c.beginPath();for(let i=0;i<=kk;i++){const X=10+i*420/119;let Y;if(w===0){Y=300-(d[i]-d[0])*3+j*14}else{Y=100+j*90-Math.sin(i*0.08*(j+1)+j*2)*35-((i*(j%2?1:-1))*0.25)}i?c.lineTo(X,Y):c.moveTo(X,Y)}c.stroke()})}
 pop('e1',24.7,29.4,0.5);
 [...hm.children].forEach((d,i)=>{const a=25.2+i*0.06;const o=Math.min(cl(t,a,a+0.2),1-cl(t,29.2,29.4));d.style.opacity=o;d.style.transform=`scale(${0.5+0.5*eb(cl(t,a,a+0.3))})`;const c=corr[i];d.style.background=c>=0.999?'#2c2838':`rgba(255,77,94,${(c-0.6)*2.2})`});
 document.getElementById('hm').style.top='640px';
 pop('g1',29.6,34.5,0.5);const g=document.getElementById('g2');const go=op('g2',31.0,34.5);g.style.opacity=go;g.style.transform=`translateX(-50%) scale(${(0.6+0.4*eb(cl(t,31.0,31.4)))*(1+0.04*Math.sin(t*8))})`;g.style.top='1080px';
 // subtitles
 const L=LINES.find(l=>t>=l[0]-0.05&&t<=l[1]+0.25);const sb=document.getElementById('sub');if(L){sb.innerHTML='<span>'+L[2]+'</span>';sb.style.opacity=Math.min(1,cl(t,L[0]-0.05,L[0]+0.1))}else sb.style.opacity=0;
};
</script></body></html>
