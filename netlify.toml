# Pagina link in bio di @cthe.trader (sito/link). Netlify pubblica solo quella cartella
# (cartella pubblicata: sito/link).
[build]
  publish = "sito/link"
  command = ""
  # Pubblica SOLO se cambia il sito (sito/, funzioni, questo file): i salvataggi di docs/ e produzione/ non consumano crediti Netlify.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- sito/ netlify/ netlify.toml"

[functions]
  # Funzioni del sito: submission-created copia i lead del modulo checklist in Brevo.
  directory = "netlify/functions"

# Link d'iscrizione a Higgsfield usato nel PDF «Il kit di C»: quando arriva il link affiliato si cambia SOLO qui.
[[redirects]]
  from = "/vai/higgsfield"
  to = "https://higgsfield.ai?fpr=marco-778d82"
  status = 302
  force = true

[[redirects]]
  from = "/link/vai/higgsfield"
  to = "https://higgsfield.ai?fpr=marco-778d82"
  status = 302
  force = true

# Algory, affiliazione principale (03/11/2026): link di Vaga con p=stanga. Si cambia SOLO qui.
[[redirects]]
  from = "/vai/algory"
  to = "https://algory.app/index.html?p=stanga"
  status = 302
  force = true

[[redirects]]
  from = "/link/vai/algory"
  to = "https://algory.app/index.html?p=stanga"
  status = 302
  force = true

# La stessa pagina si apre anche su /link/ (serve per c-thetrader.com/link, che fa da proxy qui).
[[redirects]]
  from = "/link/*"
  to = "/:splat"
  status = 200
