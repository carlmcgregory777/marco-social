# Pagina link in bio di @cthe.trader (sito/link). Netlify pubblica solo quella cartella
# (cartella pubblicata: sito/link).
[build]
  publish = "sito/link"
  command = ""

[functions]
  # Funzioni del sito: submission-created copia i lead del modulo checklist in Brevo.
  directory = "netlify/functions"

# La stessa pagina si apre anche su /link/ (serve per c-thetrader.com/link, che fa da proxy qui).
[[redirects]]
  from = "/link/*"
  to = "/:splat"
  status = 200
